# KnowEngine-Python —— Dev 编排：只启动中间件，前后端在本机用源码运行
#
# 启动：      docker compose -f docker-compose.dev.yml up -d
# 健康检查：  docker compose -f docker-compose.dev.yml ps
# 数据卷：    命名卷持久化，down 不丢数据（down -v 才清除）
#
# 端口映射（宿主端口 → 容器端口）：
#   MySQL         3307 → 3306   （刻意避开本机常见的 3306）
#   Redis         6379 → 6379
#   Elasticsearch 9200 → 9200
#   Neo4j         7474 / 7687
#   MinIO         9000 / 9001
#
# 容器内互相访问一律用容器名（mysql / redis / elasticsearch / neo4j / minio），
# 宿主上的后端通过 localhost + 映射端口访问（见 .env）。
services:
  mysql:
    image: mysql:8.0
    container_name: ke-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      KE_DB_USER: know_engine
      KE_DB_PASSWORD: know_engine
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ke-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    container_name: ke-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: ke-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j666
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    container_name: ke-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  es-data:
  neo4j-data:
  minio-data:
