# KnowEngine-Python —— Pro 编排：中间件 + 一体化应用（后端 + 前端构建产物）
#
# 启动：      docker compose -f docker-compose.prod.yml up -d --build
# 查看状态：  docker compose -f docker-compose.prod.yml ps
# 查看日志：  docker compose -f docker-compose.prod.yml logs -f api
#
# 应用镜像为多阶段构建：Node 构建 web/dist → Python 运行时由 FastAPI 同源托管，
# 因此只需要一个 api 容器，前端页面和后端接口都走 8009。
#
# 服务间访问约定：
#   容器内互访一律用「服务名/容器名」（mysql / redis / elasticsearch / neo4j / minio）
#   宿主访问用映射端口（MySQL 3307，Web 8009 …）
#   应用配置里不写死域名，全部由下面的 environment 注入，换环境只改这一处
services:
  mysql:
    image: mysql:8.0
    container_name: ke-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      KE_DB_USER: know_engine
      KE_DB_PASSWORD: know_engine
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ke-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    container_name: ke-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: ke-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j666
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio
    container_name: ke-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: know-engine-api:latest
    container_name: ke-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # ---- 应用 ----
      APP__ENV: prod
      APP__HOST: 0.0.0.0
      APP__PORT: "8009"
      APP__SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-production}
      # ---- 外部模型（可选；不配置则走降级链路）----
      LLM__API_KEY: ${LLM_API_KEY:-}
      LLM__BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # ---- MCP 外部工具（联网搜索等；默认关闭，servers 为 JSON 数组）----
      MCP__ENABLED: ${MCP_ENABLED:-false}
      MCP__SERVERS: ${MCP_SERVERS:-[]}
      # ---- 中间件：容器内用服务名，端口用容器内部端口 ----
      DB__URL: mysql+aiomysql://know_engine:know_engine@mysql:3306/know_engine?charset=utf8mb4
      DB__FALLBACK_SQLITE: "false"
      REDIS__URL: redis://redis:6379/0
      VECTOR__ES_URL: http://elasticsearch:9200
      NEO4J__URI: bolt://neo4j:7687
      NEO4J_PASSWORD: neo4j666
      STORAGE__ENDPOINT: minio:9000
      STORAGE__ACCESS_KEY: minioadmin
      STORAGE__SECRET_KEY: minioadmin
      STORAGE__SECURE: "false"
    ports:
      - "8009:8009"
    # 本地模型（Ollama/vLLM）跑在宿主机时，容器内用 host.docker.internal 访问；
    # Docker Desktop 自带该别名，Linux Docker 需显式映射到网关
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-data:/app/data          # 分片上传会话等本地态；对象文件在 MinIO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8009/api/health').read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
  es-data:
  neo4j-data:
  minio-data:
  api-data:
