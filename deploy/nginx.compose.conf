# KnowEngine-Python Compose 多副本反向代理
#
# 与 deploy/nginx.conf（多主机固定 IP）的区别：上游用 Docker 服务名 api，
# 由 Docker 内嵌 DNS 轮询解析到全部 api 副本，无需手写实例 IP。
#
# 注意：开源版 Nginx 只在启动时解析上游域名，扩缩容后需重启本容器：
#   docker restart ke-nginx
# （SSE 续流/停止生成已 Redis 化，无需会话粘性；故不启用 ip_hash。）

upstream ke_api {
    server api:8009 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    # 略大于 STORAGE__MAX_UPLOAD_BYTES（默认 200MB）
    client_max_body_size 210m;

    location / {
        proxy_pass http://ke_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式回答：关闭缓冲与 gzip，避免 token 攒批
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/health {
        proxy_pass http://ke_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
