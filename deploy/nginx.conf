# KnowEngine-Python 多实例反向代理示例
#
# 用法：改成实际实例地址后，放到 Nginx 的 conf.d/ 目录（或 include 进主配置）。
# 前置条件：所有实例共享同一套 MySQL / Redis / Elasticsearch / MinIO，
# 且上传会话目录（STORAGE__UPLOAD_ROOT）指向共享卷或 NFS。
#
# 会话粘性：ip_hash 让同一客户端的后续请求（SSE 续流、停止生成）固定落到同一实例。
# 若客户端出口 IP 多变（移动网络切换、多层 NAT），请改用云厂商负载均衡的会话保持，
# 或启用下面的 Redis 化能力（stop_signal / chat_stream 已支持跨实例）。

upstream ke_api {
    ip_hash;
    server 10.0.0.11:8009 max_fails=3 fail_timeout=10s;
    server 10.0.0.12:8009 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    # 单个请求体上限：略大于 STORAGE__MAX_UPLOAD_BYTES（默认 200MB）
    client_max_body_size 210m;

    location / {
        proxy_pass http://ke_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式回答：必须关闭缓冲与 gzip，否则 token 会被攒批下发
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 健康检查直连实例，不参与轮询缓存
    location = /api/health {
        proxy_pass http://ke_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
