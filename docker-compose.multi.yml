# 多实例（同机多副本）部署样例，与 docker-compose.prod.yml 叠加使用：
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.multi.yml up -d --scale api=3
#
# 访问入口变为 nginx： http://localhost:8090
#
# 说明：
# - api 取消容器名与端口映射，仅经 nginx 负载均衡对外；
# - 扩缩容后需重启 nginx 以重新解析副本列表： docker restart ke-nginx ；
# - 多主机部署请改用 deploy/nginx.conf（固定 IP 上游）+ 共享 NFS 上传目录。
services:
  api:
    container_name: !reset null
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    container_name: ke-nginx
    ports:
      - "8090:80"
    volumes:
      - ./deploy/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
